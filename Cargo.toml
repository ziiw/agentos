[package]
name = "agentos"
version = "0.0.1"
edition = "2024"
description = "Transactional, capability-scoped runtime for AI agents on Linux"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
humantime = "2"
ignore = "0.4"
landlock = "0.4"
libc = "0.2"
nix = { version = "0.30", features = ["feature", "fs", "hostname", "mount", "poll", "process", "sched", "signal", "user"] }
rcgen = "0.13"
# ring rather than the default aws-lc-rs: no cmake/C toolchain needed to build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
toml = "0.8"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
