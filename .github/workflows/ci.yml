name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Real Ubuntu 24.04 kernels: Landlock is enforced here (Docker Desktop's
    # kernel doesn't have it), and AppArmor restricts unprivileged user
    # namespaces, so the install instructions in README.md get exercised too.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustc --version

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      - name: Install agent, with the AppArmor profile from README.md
        run: |
          sudo install -m 0755 target/release/agent /usr/local/bin/agent
          sudo tee /etc/apparmor.d/agentos >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile agentos /usr/local/bin/agent flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/agentos

      - name: agent doctor
        run: agent doctor

      - name: A virtual display for the --display tests, a bus for the D-Bus ones, a software TPM for the receipts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdotool dbus-daemon
          # (the TPM tests skip themselves if these aren't there; the package for swtpm's TCTI is named differently across releases)
          sudo apt-get install -y -qq swtpm swtpm-tools tpm2-tools libtss2-tcti-swtpm0t64 || sudo apt-get install -y -qq swtpm swtpm-tools tpm2-tools libtss2-tcti-swtpm0 || true

      - name: End-to-end tests
        run: REQUIRE_LANDLOCK=1 bash tests/e2e.sh

      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.runner }}
          path: target/release/agent
          retention-days: 1

  package:
    # The agent layer as .deb and .rpm, installed for real: the .deb on this
    # runner, where Ubuntu restricts user namespaces (so the AppArmor profile
    # the package loads has to work), and the .rpm in a Fedora container.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agent-${{ matrix.runner }}
          path: target/release

      - name: nfpm
        run: |
          arch=$(uname -m | sed 's/aarch64/arm64/')
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_${arch}.tar.gz" | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version | grep GitVersion

      - name: Build the packages
        run: |
          chmod +x target/release/agent
          scripts/package.sh deb
          scripts/package.sh rpm

      - name: Install the .deb
        run: |
          sudo apt-get install -y ./dist/*.deb
          dpkg -L agentos
          test -f /etc/apparmor.d/agentos
          agent --version
          agent doctor
          agent run --no-cwd -- sh -c 'echo "sandboxed as $(id -un)"'

      - name: Remove it again
        run: |
          sudo apt-get remove -y agentos
          test ! -e /usr/bin/agent
          test ! -e /etc/apparmor.d/agentos

      - name: Install the .rpm on Fedora
        run: |
          # (Fedora's own registry: Docker Hub refuses anonymous pulls from busy runners)
          docker run --rm -v "$PWD/dist:/dist:ro" registry.fedoraproject.org/fedora:42 sh -c '
            dnf install -y /dist/*.rpm >/dev/null
            rpm -qi agentos | head -4
            agent --version
            dnf remove -y agentos >/dev/null
            test ! -e /usr/bin/agent'

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.runner }}
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 14

  image:
    # The distribution: build the bootc image and run the whole e2e suite
    # inside it, on a real kernel.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the agentos image
        run: docker build -f image/Containerfile --build-arg AGENTOS_REV="$(git rev-parse --short HEAD)" -t agentos:ci .

      - name: End-to-end tests inside the image
        run: |
          # Inside a privileged container agent runs unconfined, so lift
          # Ubuntu's userns restriction for this job (the host install uses
          # the AppArmor profile instead).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p /tmp/e2e && chmod 1777 /tmp/e2e
          docker run --rm --privileged -v "$PWD:/src:ro" -v /tmp/e2e:/e2e agentos:ci bash -c '
            # (a bus and a software TPM for the tests that use them; they skip themselves without)
            dnf -y install swtpm swtpm-tools dbus-daemon >/dev/null 2>&1 || true
            cat /usr/lib/os-release | grep PRETTY_NAME
            agent --version
            useradd -m tester
            su - tester -c "E2E_DIR=/e2e bash /src/tests/e2e.sh"'

