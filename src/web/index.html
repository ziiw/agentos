<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentd</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3df;
    --accent: #3b5bdb; --ok: #2b8a3e; --warn: #c27a00; --bad: #c92a2a; --add: #e6f4ea; --del: #fdecea;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1e1e1c; --text: #ecebe6; --muted: #9a9993; --line: #2e2e2b;
      --accent: #748ffc; --ok: #69db7c; --warn: #ffc078; --bad: #ff8787; --add: #1b3324; --del: #3b1d1d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-left: auto; align-self: center; }
  .dot.live { background: var(--ok); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .ask { border-color: var(--warn); }
  .ask .what { font-size: 16px; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .ask .reason { color: var(--muted); font-style: italic; margin: 0 0 6px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button { font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text);
           padding: 8px 14px; cursor: pointer; min-height: 40px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .task { cursor: pointer; }
  .task .title { font-weight: 600; overflow-wrap: anywhere; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .badge.running { color: var(--accent); border-color: var(--accent); }
  .badge.committed { color: var(--ok); border-color: var(--ok); }
  .badge.crashed, .badge.failed { color: var(--bad); border-color: var(--bad); }
  .badge.exited, .badge.stopped, .badge.timed, .badge.over { color: var(--warn); border-color: var(--warn); }
  .counts { font-family: var(--mono); font-size: 12px; }
  .a { color: var(--ok); } .m { color: var(--warn); } .d { color: var(--bad); } .p { color: var(--accent); }
  pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
        padding: 10px 12px; overflow-x: auto; white-space: pre; margin: 10px 0 0; }
  pre .add { background: var(--add); display: block; } pre .del { background: var(--del); display: block; }
  pre .hunk { color: var(--accent); display: block; }
  .empty { color: var(--muted); font-size: 14px; }
  .doing { font-family: var(--mono); font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .notice { background: var(--card); border: 1px solid var(--bad); border-radius: 12px; padding: 14px 16px; }
  .output { white-space: pre-wrap; }
  .given { margin-top: 6px; } .given button { min-height: 32px; padding: 4px 10px; margin-left: auto; }
  pre.live { max-height: 320px; overflow-y: auto; }
  .screen { display: block; width: 100%; height: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; background: #000; }
  #screenbox { outline: none; }
  #screenbox.takeover .screen { border-color: var(--warn); cursor: crosshair; }
  #screenbox.takeover:focus .screen { box-shadow: 0 0 0 2px var(--warn); }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 0; font-weight: 600; }
  .new label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .new select, .new textarea, .new input { font: inherit; font-size: 15px; width: 100%; color: var(--text); background: var(--bg);
                                          border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .new textarea { min-height: 96px; resize: vertical; }
  .new .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 10px; }
  .error { color: var(--bad); font-size: 14px; margin-top: 10px; }
  header button { margin-left: auto; }
  header .dot { margin-left: 8px; }
  header { flex-wrap: wrap; row-gap: 8px; }
  header .pill { margin-left: auto; min-height: 34px; padding: 4px 12px; font-family: var(--mono); font-size: 13px; }
  header .pill + button { margin-left: 0; }
  .pill.warn { color: var(--warn); border-color: var(--warn); } .pill.over { color: var(--bad); border-color: var(--bad); }
  @media (max-width: 520px) { header .sub, header .pill .when { display: none; } }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0 4px; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .bar.warn span { background: var(--warn); } .bar.over span { background: var(--bad); }
  .line { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 3px 0; }
  .line .counts { white-space: nowrap; }
  .line .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .budget { padding: 10px 0; border-top: 1px solid var(--line); } .budget:first-of-type { border-top: 0; }
  .budget .row { margin-top: 8px; } .budget .row button { min-height: 34px; padding: 4px 12px; }
  .card.used { border-color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1>agentos</h1><span class="sub">agentd console</span>
    <button id="spend-open" class="pill" hidden></button>
    <button id="new-open" class="primary">New task</button><span class="dot" id="dot" title="connection"></span>
  </header>
  <div id="notice"></div>
  <section id="spend"></section>
  <section id="new"></section>
  <section id="over"></section>
  <section id="asks"></section>
  <section id="schedules"></section>
  <h2>Tasks</h2>
  <section id="tasks"><p class="empty">Loading…</p></section>
</main>
<script>
(() => {
  const store = {
    get() { try { return localStorage.getItem("agentd-token"); } catch { return null; } },
    set(v) { try { localStorage.setItem("agentd-token", v); } catch {} },
  };
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("token");
  if (fromHash) { store.set(fromHash); history.replaceState(null, "", location.pathname); }
  let token = fromHash || store.get();
  let openTask = null;
  let lastTasks = [];
  let spendOpen = false;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const upper = (s) => String(s ?? "").charAt(0).toUpperCase() + String(s ?? "").slice(1);
  const ago = (ms) => {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return s + "s ago"; if (s < 3600) return Math.round(s / 60) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago"; return Math.round(s / 86400) + "d ago";
  };

  async function api(path, body) {
    const res = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (res.status === 401) throw new Error("unauthorized");
    return res.json();
  }

  function colorDiff(text) {
    return text.split("\n").map((l) => {
      const e = esc(l);
      if (l.startsWith("@@")) return `<span class="hunk">${e}</span>`;
      if (l.startsWith("+") && !l.startsWith("+++")) return `<span class="add">${e}</span>`;
      if (l.startsWith("-") && !l.startsWith("---")) return `<span class="del">${e}</span>`;
      return e;
    }).join("\n");
  }

  // A model call waits on this one: raise the budget, or let the task stop.
  function budgetAsk(q) {
    const offers = (q.offers || []).map((o, i) =>
      `<button class="${i ? "" : "primary"}" data-q="${q.id}" data-d="raise" data-to="${esc(o)}">Raise to ${esc(o)}</button>`).join("");
    return `<div class="card ask">
      <div class="meta">${esc(q.title)} · ${ago(q.asked_ms)}</div>
      <div class="what">${esc(upper(q.target))} is used up${q.reason ? `: <strong>${esc(q.reason)}</strong>` : ""}</div>
      <div class="meta">The agent's next model call waits for your answer.</div>
      <div class="row">${offers}<button data-q="${q.id}" data-d="raise" data-other="${esc(q.target)}">Other…</button>
        <button class="danger" data-q="${q.id}" data-d="deny">Let it stop</button></div></div>`;
  }

  function renderAsks(asks) {
    if (!asks.length) { $("asks").innerHTML = ""; return; }
    $("asks").innerHTML = `<h2>Waiting for you</h2>` + asks.map((q) => {
      const project = q.project.split("/").filter(Boolean).pop() || q.project;
      const kind = q.kind || "host";
      if (kind === "budget") return budgetAsk(q);
      const what = kind === "read" ? "The agent asks to read"
        : kind === "write" ? "The agent asks to change"
        : kind === "tool" ? "The agent wants to call"
        : q.reason ? "The agent asks to reach" : "The agent wants to reach";
      const held = kind === "write" ? `<div class="meta">Its changes there are held for your review, like the rest.</div>` : "";
      const why = !q.reason ? "" : kind === "tool" ? `<pre>${esc(q.reason)}</pre>` : `<div class="reason">\u201c${esc(q.reason)}\u201d</div>`;
      const taint = q.taint ? `<div class="meta" style="color:var(--warn)">\u26a0 This task has read untrusted input: ${esc(q.taint)}</div>` : "";
      const always = kind === "host" || kind === "tool" ? `<button data-q="${q.id}" data-d="always">Always in ${esc(project)}</button>` : "";
      const allow = kind === "tool"
        ? `<button class="primary" data-q="${q.id}" data-d="call">Allow this call</button><button data-q="${q.id}" data-d="hold">Hold for review</button><button data-q="${q.id}" data-d="once">For this task</button>`
        : `<button class="primary" data-q="${q.id}" data-d="once">Allow for this task</button>`;
      return `<div class="card ask">
        <div class="meta">${esc(q.title)} · ${ago(q.asked_ms)}</div>
        <div class="what">${what} <strong>${esc(q.target)}</strong></div>
        ${why}${taint}${held}
        <div class="row">
          ${allow}
          ${always}
          <button class="danger" data-q="${q.id}" data-d="deny">Deny</button>
        </div></div>`;
    }).join("");
  }

  function counts(t) {
    const c = t.changes; const parts = [];
    if (c && c.added + c.modified + c.deleted > 0) parts.push(`<span class="a">+${c.added}</span> <span class="m">~${c.modified}</span> <span class="d">-${c.deleted}</span>`);
    if (c && c.git) parts.push(`<span class="p">git</span>`);
    if (t.pushes) parts.push(`<span class="p">↑${t.pushes}</span>`);
    if (t.calls) parts.push(`<span class="p" title="held tool calls and API requests">⏸${t.calls}</span>`);
    return parts.length ? `<span class="counts">${parts.join(" ")}</span>` : "";
  }

  // "$0.42", or against the budget: "$0.42 of $2.00", "120k of 1M tokens".
  function spend(t) {
    if (!t.cost && !t.budget) return "";
    const inTokens = (t.budget || "").endsWith("tokens");
    const used = inTokens ? (t.tokens || "0") : (t.cost || "$0");
    const of = t.budget ? ` of ${esc(t.budget)}` : "";
    return `<span class="counts">${esc(used)}${of}</span>`;
  }

  // One budget across tasks: where it stands, and raising it until it resets.
  function raiseRow(b) {
    const until = b.period === "daily" ? " today" : b.period === "weekly" ? " this week" : " this month";
    const near = b.over || b.fraction >= 0.8;
    const data = `data-raise-period="${b.period}" data-project="${esc(b.project || "")}" data-what="${esc(b.label)}'s budget for ${esc(b.scope)}" data-cap="${esc(b.cap)}"`;
    const offers = near ? b.offers.map((o, i) => `<button class="${i ? "" : "primary"}" ${data} data-to="${esc(o.to)}">Raise to ${esc(o.shown)}${until}</button>`).join("") : "";
    return `<div class="row">${offers}<button ${data}>${near ? "Other…" : "Raise…"}</button></div>`;
  }

  function budgetLine(b) {
    const cls = b.over ? "over" : b.fraction >= 0.8 ? "warn" : "";
    const pct = Math.min(100, Math.round(b.fraction * 100));
    return `<div class="budget">
      <div class="line"><span class="name"><strong>${esc(upper(b.label))}</strong> · ${esc(b.scope)}</span><span class="counts">${esc(b.spent)}</span></div>
      <div class="bar ${cls}"><span style="width:${pct}%"></span></div>
      <div class="meta">${b.over ? "used up · " : ""}resets ${esc(b.resets)}${b.raised ? ` · raised from ${esc(b.configured)}` : ""}</div>
      ${raiseRow(b)}</div>`;
  }

  function renderSpend(sp) {
    const pill = $("spend-open");
    if (!sp) { pill.hidden = true; $("over").innerHTML = ""; $("spend").innerHTML = ""; return; }
    const today = sp.periods[0];
    const daily = sp.budgets.find((b) => b.period === "daily" && !b.project);
    pill.hidden = false;
    pill.innerHTML = `<span class="when">today </span>${esc(daily ? daily.spent : today.spent)}`;
    pill.className = "pill" + (sp.budgets.some((b) => b.over) ? " over" : sp.budgets.some((b) => b.fraction >= 0.8) ? " warn" : "");
    // Used up: new tasks won't start and running ones can't call their model.
    const over = sp.budgets.filter((b) => b.over);
    $("over").innerHTML = over.length ? `<h2>Budget used up</h2>` + over.map((b) => `<div class="card used">
      <div class="what">${esc(upper(b.label))}'s budget for ${esc(b.scope)} is used up: <strong>${esc(b.spent)}</strong></div>
      <div class="meta">Until it resets ${esc(b.resets)}, new tasks won't start and running ones can't call their model, unless you raise it.</div>
      ${raiseRow(b)}</div>`).join("") : "";
    if (!spendOpen) { $("spend").innerHTML = ""; return; }
    const periods = sp.periods.map((p) => `<div class="line"><span>${esc(upper(p.label))}</span><span class="counts">${esc(p.spent)} · ${esc(p.tokens)} tokens</span></div>`).join("");
    const budgets = sp.budgets.length ? sp.budgets.map(budgetLine).join("")
      : `<p class="empty">No budgets across tasks. Set <code>daily</code>, <code>weekly</code> or <code>monthly</code> under <code>[limits]</code> in your config.</p>`;
    const tasks = sp.today.length ? sp.today.map((t) => `<div class="line"><span class="name">${esc(t.title)}</span><span class="counts">${esc(t.spent)}</span></div>`).join("")
      : `<p class="empty">No model calls today.</p>`;
    $("spend").innerHTML = `<h2>Spend</h2><div class="card">${periods}<h3>Budgets across tasks</h3>${budgets}<h3>Today, by task</h3>${tasks}
      <div class="row"><button data-spend="close">Close</button></div></div>`;
  }

  // Tasks agentd starts on a timer: what, how often, when next.
  function renderSchedules(list) {
    if (!list || !list.length) { $("schedules").innerHTML = ""; return; }
    const when = (ms) => {
      if (!ms) return "once agentd sees it";
      const s = Math.round((ms - Date.now()) / 1000);
      if (s <= 0) return "as soon as it can";
      if (s < 120) return "in " + s + "s"; if (s < 7200) return "in " + Math.round(s / 60) + "m";
      if (s < 172800) return "in " + Math.round(s / 3600) + "h"; return "in " + Math.round(s / 86400) + "d";
    };
    $("schedules").innerHTML = `<h2>Schedules</h2>` + list.map((x) => `<div class="card">
      <div class="title">${esc(x.name)} <span class="meta">every ${esc(x.every)} · next ${esc(when(x.next_ms))}</span></div>
      <div class="meta">${esc(x.task.length > 90 ? x.task.slice(0, 90) + "…" : x.task)}</div>
      <div class="meta">${x.runs} run${x.runs === 1 ? "" : "s"}${x.last_task ? ` · last: ${esc(x.last_task)}` : ""}${x.skipped ? ` · ${x.skipped} skipped` : ""}${x.error ? ` · <span class="d">${esc(x.error)}</span>` : ""}</div>
      <div class="row"><button data-schedule="${esc(x.name)}">Run now</button></div></div>`).join("");
  }

  function renderTasks(tasks) {
    if (!tasks.length) { $("tasks").innerHTML = `<p class="empty">No tasks yet. Start one with <code>agent do "…"</code>.</p>`; return; }
    $("tasks").innerHTML = tasks.map((t) => {
      const status = t.status.split(" ")[0];
      return `<div class="card task" data-id="${t.id}">
        <div class="title">${esc(t.title)}</div>
        <div class="meta"><span class="badge ${esc(status)}">${esc(t.status)}</span><span>${t.id}</span><span>${ago(t.started_ms)}</span>${counts(t)}${spend(t)}</div>
        ${t.doing ? `<div class="meta doing">⏺ ${esc(t.doing)}</div>` : ""}
        ${openTask === t.id ? `<div id="detail"><p class="empty">Loading…</p></div>` : ""}
      </div>`;
    }).join("");
    if (openTask) loadDetail(openTask);
  }

  async function loadDetail(id) {
    const el = $("detail"); if (!el) return;
    const t = await api("/api/tasks/" + id);
    const raise = t.budget ? `<button data-raise-task="${id}" data-cap="${esc(t.budget)}">Raise budget</button>` : "";
    const actions = t.live
      ? `<div class="row">${raise}<button class="danger" data-act="stop" data-id="${id}">Stop</button></div>`
      : t.open ? `<div class="row">
        <button class="primary" data-act="commit" data-id="${id}">Commit${t.pushes || t.calls ? " and send" : ""}</button>
        ${t.pushes || t.calls ? `<button data-act="push" data-id="${id}">Send only what's held</button>` : ""}
        <button class="danger" data-act="rollback" data-id="${id}">Roll back</button></div>` : "";
    const output = t.output ? `<h3>Output</h3><pre class="output live" id="live">${esc(t.output)}</pre>` : "";
    const given = (t.given || []).length ? `<h3>Granted while it runs</h3>` + t.given.map((g) => `<div class="meta given">
        <span>${esc(g.kind)}</span><strong>${esc(g.target)}</strong>${g.access ? `<span>${esc(g.access)}</span>` : ""}
        ${g.revoked ? `<span>taken back</span>` : `<button class="danger" data-revoke="${esc(g.target)}" data-id="${id}">Take back</button>`}</div>`).join("") : "";
    const screen = t.screen
      ? `<h3>Screen</h3><div class="row" id="screenbar">${t.screen.live ? `<button data-takeover="${id}">${takeover === id ? "Stop acting on it" : "Act on it"}</button>` : ""}<span class="meta">${t.screen.width}×${t.screen.height}${t.screen.live ? "" : ", as it ended"}</span></div><div id="screenbox" tabindex="0" class="${takeover === id ? "takeover" : ""}" data-w="${t.screen.width}" data-h="${t.screen.height}" data-id="${id}"></div>`
      : "";
    el.innerHTML = `${actions}<div id="result"></div>${given}${output}${screen}<h3>Changes</h3><pre>${colorDiff(t.diff)}</pre><h3>Journal</h3><pre>${esc(t.log)}</pre>`;
    const live = $("live"); if (live) live.scrollTop = live.scrollHeight;
    if (t.screen) showScreen(id);
  }

  // A task's screen: the latest picture is shown at once, then replaced as a fresh one arrives.
  // (Fetched with the token in a header, so it never appears in a URL.)
  let screenUrl = null, screenFor = null, takeover = null, inputs = Promise.resolve();
  async function showScreen(id) {
    if (screenFor !== id) { if (screenUrl) URL.revokeObjectURL(screenUrl); screenUrl = null; screenFor = id; }
    const show = (url) => { const box = $("screenbox"); if (box) box.innerHTML = `<img class="screen" src="${url}" alt="the task's screen" draggable="false">`; };
    if (screenUrl) show(screenUrl);
    const res = await fetch("/api/tasks/" + id + "/screen.png?w=960", { headers: { Authorization: "Bearer " + token } }).catch(() => null);
    if (!res || !res.ok) { if (!screenUrl && $("screenbox")) $("screenbox").innerHTML = `<p class="empty">No picture yet.</p>`; return; }
    const url = URL.createObjectURL(await res.blob());
    if (screenUrl) URL.revokeObjectURL(screenUrl);
    screenUrl = url;
    show(url);
  }
  // Something done at the screen, in order, then a fresh picture.
  function actOnScreen(id, body) {
    inputs = inputs.then(() => api("/api/tasks/" + id + "/input", body)).then((r) => { if (r && r.error && $("result")) $("result").innerHTML = `<div class="error">${esc(r.error)}</div>`; setTimeout(() => showScreen(id), 250); }).catch(() => {});
  }

  // The "new task" form: your projects and agents, from agentd.
  let launchpad = null;
  async function openNew() {
    if (!launchpad) launchpad = await api("/api/launchpad").catch(() => null);
    const lp = launchpad || { projects: [], agents: [] };
    if (!lp.projects.length) {
      $("new").innerHTML = `<div class="card new"><p class="empty">No projects yet. Run <code>agent do</code> in a folder once, or list folders under <code>[console] projects</code> in your config.</p>
        <div class="row"><button data-new="close">Close</button></div></div>`;
      return;
    }
    const projects = lp.projects.map((p) => `<option value="${esc(p.path)}">${esc(p.shown)}</option>`).join("");
    const agents = lp.agents.map((a) => `<option value="${esc(a.name)}"${a.default ? " selected" : ""}${a.installed ? "" : " disabled"}>${esc(a.name)}${a.installed ? "" : " (not installed)"}</option>`).join("");
    $("new").innerHTML = `<div class="card new">
      <label for="np">Project</label><select id="np">${projects}</select>
      <label for="nt">Task</label><textarea id="nt" placeholder="What should the agent do?"></textarea>
      <div class="grid">
        <div><label for="na">Agent</label><select id="na">${agents}</select></div>
        <div><label for="nb">Budget</label><input id="nb" placeholder="e.g. 2usd or 500k"></div>
        <div><label for="nto">Stop after</label><input id="nto" placeholder="e.g. 30m"></div>
      </div>
      <div class="error" id="nerr"></div>
      <div class="row"><button class="primary" data-new="start">Start</button><button data-new="close">Cancel</button></div>
    </div>`;
    $("nt").focus();
  }

  async function startTask(button) {
    const body = { project: $("np").value, task: $("nt").value, agent: $("na").value, budget: $("nb").value, timeout: $("nto").value };
    if (!body.task.trim()) { $("nerr").textContent = "Describe the task first."; return; }
    button.disabled = true;
    const r = await api("/api/tasks", body).catch((e) => ({ error: e.message }));
    if (r.error) { $("nerr").textContent = r.error; button.disabled = false; return; }
    $("new").innerHTML = "";
    openTask = r.id;
    refresh();
  }

  async function refresh() {
    if (!token) { $("notice").innerHTML = `<div class="notice">Open the link that <code>agent serve</code> printed: it carries the access token.</div>`; return; }
    try {
      const [asks, tasks, sp, sched] = await Promise.all([api("/api/approvals"), api("/api/tasks"), api("/api/spend").catch(() => null), api("/api/schedules").catch(() => null)]);
      $("notice").innerHTML = ""; $("dot").classList.add("live");
      if (!document.querySelector("#spend button:focus, #over button:focus")) renderSpend(sp && sp.periods ? sp : null);
      renderAsks(asks);
      if (!document.querySelector("#schedules button:focus")) renderSchedules(Array.isArray(sched) ? sched : null);
      lastTasks = tasks;
      if (!document.querySelector("#detail button:focus")) renderTasks(tasks);
    } catch (e) {
      $("dot").classList.remove("live");
      if (e.message === "unauthorized") { $("notice").innerHTML = `<div class="notice">This link's token isn't valid anymore. Open the one <code>agent serve</code> printed.</div>`; }
    }
  }

  $("new-open").addEventListener("click", () => ($("new").innerHTML ? ($("new").innerHTML = "") : openNew()));
  $("spend-open").addEventListener("click", () => { spendOpen = !spendOpen; refresh(); });

  document.addEventListener("click", async (ev) => {
    const box = ev.target.closest("#screenbox");
    if (box && takeover === box.dataset.id && ev.target.tagName === "IMG") {
      const r = ev.target.getBoundingClientRect();
      const x = Math.round(((ev.clientX - r.left) / r.width) * Number(box.dataset.w));
      const y = Math.round(((ev.clientY - r.top) / r.height) * Number(box.dataset.h));
      box.focus(); actOnScreen(box.dataset.id, { kind: "click", x, y, button: 1 });
      return;
    }
    const run = ev.target.closest("button[data-schedule]");
    if (run) {
      run.disabled = true;
      const r = await api("/api/schedules/" + run.dataset.schedule + "/run", {}).catch((e) => ({ error: e.message }));
      if (r.error) alert(r.error); else openTask = r.id;
      refresh(); return;
    }
    const t = ev.target.closest("button[data-takeover]");
    if (t) { takeover = takeover === t.dataset.takeover ? null : t.dataset.takeover; loadDetail(t.dataset.takeover); if (takeover) setTimeout(() => $("screenbox") && $("screenbox").focus(), 50); return; }
    const b = ev.target.closest("button");
    if (b && b.dataset.new === "close") { $("new").innerHTML = ""; return; }
    if (b && b.dataset.new === "start") return startTask(b);
    if (b && b.dataset.revoke) {
      if (!confirm(`Take back ${b.dataset.revoke} from this task?`)) return;
      b.disabled = true;
      const r = await api(`/api/tasks/${b.dataset.id}/revoke`, { target: b.dataset.revoke }).catch((e) => ({ output: e.message }));
      const res = $("result");
      if (res) res.innerHTML = `<pre class="output">${esc(r.output || r.error || "")}</pre>`;
      setTimeout(refresh, 500);
      return;
    }
    if (b && b.dataset.spend === "close") { spendOpen = false; return refresh(); }
    if (b && b.dataset.raisePeriod) {
      const to = b.dataset.to || prompt(`Raise ${b.dataset.what} (now ${b.dataset.cap}) to, until it resets:`, "");
      if (!to) return;
      b.disabled = true;
      const r = await api("/api/spend/raise", { period: b.dataset.raisePeriod, project: b.dataset.project || undefined, to }).catch((e) => ({ error: e.message }));
      if (r.error) alert(r.error);
      return refresh();
    }
    if (b && b.dataset.raiseTask) {
      const to = prompt(`Raise this task's budget (now ${b.dataset.cap}) to:`, "");
      if (!to) return;
      const r = await api(`/api/tasks/${b.dataset.raiseTask}/raise`, { to }).catch((e) => ({ output: e.message }));
      const res = $("result");
      if (res) res.innerHTML = `<pre class="output">${esc(r.output || r.error || "")}</pre>`;
      setTimeout(refresh, 500);
      return;
    }
    if (b && b.dataset.q) {
      const body = { decision: b.dataset.d };
      if (b.dataset.d === "raise") {
        body.to = b.dataset.to || prompt(`Raise ${b.dataset.other} to:`, "");
        if (!body.to) return;
      }
      b.disabled = true;
      const r = await api("/api/approvals/" + b.dataset.q, body).catch(() => ({}));
      if (r.error) alert(r.error);
      return refresh();
    }
    if (b && b.dataset.act) {
      if (b.dataset.act === "rollback" && !confirm("Discard this task's changes and everything held (pushes, tool calls, API requests)?")) return;
      if (b.dataset.act === "stop" && !confirm("Stop this task? What it did so far is held for review.")) return;
      document.querySelectorAll("#detail button").forEach((x) => (x.disabled = true));
      const r = await api(`/api/tasks/${b.dataset.id}/${b.dataset.act}`, {});
      const res = $("result");
      if (res) res.innerHTML = `<pre class="output">${esc(r.output || r.error || "")}</pre>`;
      setTimeout(refresh, 1500);
      return;
    }
    const card = ev.target.closest(".task");
    if (card && !ev.target.closest("#detail")) { openTask = openTask === card.dataset.id ? null : card.dataset.id; renderTasks(lastTasks); }
  });

  // At the screen, the keyboard goes to the task.
  const KEYS = { Enter: "Return", Backspace: "BackSpace", Delete: "Delete", Tab: "Tab", Escape: "Escape", ArrowUp: "Up", ArrowDown: "Down",
                 ArrowLeft: "Left", ArrowRight: "Right", Home: "Home", End: "End", PageUp: "Prior", PageDown: "Next", " ": "space" };
  document.addEventListener("keydown", (ev) => {
    const box = ev.target.closest && ev.target.closest("#screenbox");
    if (!box || takeover !== box.dataset.id || ev.metaKey) return;
    const named = KEYS[ev.key] || (/^F([1-9]|1[0-2])$/.test(ev.key) ? ev.key : null);
    const mods = [ev.ctrlKey && "ctrl", ev.altKey && "alt", (ev.shiftKey && (named || ev.ctrlKey || ev.altKey)) && "shift"].filter(Boolean);
    if (ev.key.length === 1 && !ev.ctrlKey && !ev.altKey) actOnScreen(box.dataset.id, { kind: "type", text: ev.key });
    else if (named || (ev.key.length === 1 && /^[A-Za-z0-9]$/.test(ev.key))) actOnScreen(box.dataset.id, { kind: "key", key: [...mods, named || ev.key.toLowerCase()].join("+") });
    else return;
    ev.preventDefault();
  });
  // A running task's screen moves faster than the rest of the page.
  setInterval(() => { if (openTask && $("screenbox") && document.visibilityState === "visible") showScreen(openTask); }, 1000);

  // A fresh link from `agent serve` opened in this same tab.
  window.addEventListener("hashchange", () => {
    const t = new URLSearchParams(location.hash.slice(1)).get("token");
    if (t) { token = t; store.set(t); history.replaceState(null, "", location.pathname); refresh(); }
  });

  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
